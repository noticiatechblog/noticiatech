name: Vercel Production Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
     # 03:30 UTC = 00:30 Brasil (UTC-3)
  - cron: "30 3 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy Hook
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"